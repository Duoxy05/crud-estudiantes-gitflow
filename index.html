<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD de Estudiantes</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Registro de Estudiantes</h1>
    <p>CRUD con HTML, CSS y JavaScript · Programación III</p>
  </header>

  <main class="layout">

    <section class="card">
      <div class="card-head">
        <h2>Estudiantes</h2>
        <span id="count" class="badge"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Matrícula</th>
              <th>Nombre</th>
              <th>Correo</th>
              <th>Carrera</th>
              <th>Ingreso</th>
            </tr>
          </thead>
          <tbody id="student-rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/date.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
