<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD de Estudiantes</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Registro de Estudiantes</h1>
    <p>CRUD con HTML, CSS y JavaScript · Programación III</p>
  </header>

  <main class="layout">
    <section class="card" id="form-card">
      <h2 id="form-title">Nuevo estudiante</h2>
      <form id="student-form" novalidate>
        <input type="hidden" id="student-id">

        <div class="field">
          <label for="matricula">Matrícula</label>
          <input id="matricula" name="matricula" placeholder="2025-0001" autocomplete="off" required>
          <small class="error" data-error-for="matricula"></small>
        </div>

        <div class="field">
          <label for="nombre">Nombre completo</label>
          <input id="nombre" name="nombre" placeholder="Ana Martínez" autocomplete="off" required>
          <small class="error" data-error-for="nombre"></small>
        </div>

        <div class="field">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" placeholder="ana@example.com" autocomplete="off" required>
          <small class="error" data-error-for="email"></small>
        </div>

        <div class="field">
          <label for="carrera">Carrera</label>
          <select id="carrera" name="carrera" required>
            <option value="">Selecciona una carrera</option>
            <option>Desarrollo de Software</option>
            <option>Redes de Información</option>
            <option>Seguridad Informática</option>
            <option>Inteligencia Artificial</option>
            <option>Multimedia</option>
          </select>
          <small class="error" data-error-for="carrera"></small>
        </div>

        <div class="field">
          <label for="fechaIngreso">Fecha de ingreso</label>
          <input id="fechaIngreso" name="fechaIngreso" type="date" required>
          <small class="error" data-error-for="fechaIngreso"></small>
        </div>

        <div class="actions">
          <button type="submit" class="btn primary" id="submit-btn">Guardar</button>
          <button type="button" class="btn" id="cancel-btn" hidden>Cancelar</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Estudiantes</h2>
        <span id="count" class="badge"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Matrícula</th>
              <th>Nombre</th>
              <th>Correo</th>
              <th>Carrera</th>
              <th>Ingreso</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="student-rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/storage.js"></script>
  <script src="js/date.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
